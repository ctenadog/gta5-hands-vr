name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# only the newest push builds; two parallel runs used to delete each other's release
concurrency:
  group: release-latest
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 zip unzip
      - name: Build
        run: sh ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GTA5VR
          path: build/pkg/
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 5
          gh release create latest build/GTA5VR-*.zip build/version.txt build/setup.bat install/uninstall.bat --title "GTA V Hands VR (latest)" --notes "Установка: скачайте setup.bat и запустите. Затем SteamVR -> GTA V (сюжет) -> F8. Мод сам проверяет и ставит обновления. Удаление: uninstall.bat. / Install: download setup.bat and run it, then SteamVR -> GTA V story mode -> F8. Story mode only, DEV build." --prerelease
