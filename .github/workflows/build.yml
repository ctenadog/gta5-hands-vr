name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# only the newest push builds; two parallel runs used to delete each other's release
concurrency:
  group: release-latest
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get mingw compiler (llvm-mingw, prebuilt, no apt)
        timeout-minutes: 8
        run: |
          # apt on the runner hung several times; llvm-mingw is a self-contained x86_64-w64-mingw32 toolchain on GitHub
          V=20261006
          for i in 1 2 3; do
            curl -sSL --retry 3 --max-time 300 -o lm.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$V/llvm-mingw-$V-ucrt-ubuntu-22.04-x86_64.tar.xz" && break
            sleep 5
          done
          mkdir -p $HOME/lm && tar xf lm.tar.xz -C $HOME/lm --strip-components=1
          echo "$HOME/lm/bin" >> $GITHUB_PATH
          $HOME/lm/bin/x86_64-w64-mingw32-g++ --version | head -1
          which zip unzip
      - name: Build
        run: sh ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GTA5VR
          path: build/pkg/
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 5
          gh release create latest build/GTA5VR-*.zip install/setup.bat install/update.bat install/uninstall.bat --title "GTA V Hands VR (latest)" --notes "Установка: скачайте setup.bat и запустите. Затем SteamVR -> GTA V (сюжет) -> F8. Обновление: update.bat. Удаление: uninstall.bat. / Install: download setup.bat and run it, then SteamVR -> GTA V story mode -> F8. Story mode only, DEV build." --prerelease
