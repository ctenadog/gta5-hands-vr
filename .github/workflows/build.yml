name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# only the newest push builds; two parallel runs used to delete each other's release
concurrency:
  group: release-latest
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        timeout-minutes: 15
        run: |
          # apt on the runner sometimes hangs on the default mirror: limit each try, then switch mirror
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && \
               timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends mingw-w64 zip unzip; then
              exit 0
            fi
            echo "apt try $i failed - switching mirror"
            sudo sed -i -E 's#https?://[a-z.]*archive\.ubuntu\.com/ubuntu#http://mirror.yandex.ru/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            [ $i = 2 ] && sudo sed -i -E 's#http://mirror\.yandex\.ru/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1
      - name: Build
        run: sh ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GTA5VR
          path: build/pkg/
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 5
          gh release create latest build/GTA5VR-*.zip install/setup.bat install/update.bat install/uninstall.bat --title "GTA V Hands VR (latest)" --notes "Установка: скачайте setup.bat и запустите. Затем SteamVR -> GTA V (сюжет) -> F8. Обновление: update.bat. Удаление: uninstall.bat. / Install: download setup.bat and run it, then SteamVR -> GTA V story mode -> F8. Story mode only, DEV build." --prerelease
